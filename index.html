<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mercatini Log</title>
  <style>
    :root {
      --bg: #111317;
      --surface: #191c22;
      --surface-2: #22262f;
      --surface-3: #2b303c;
      --text: #f3f5f7;
      --muted: #9aa2b1;
      --accent: #4dabf7;
      --accent-text: #091526;
      --ok: #51cf66;
      --warn: #fcc419;
      --danger: #ff6b6b;
      --border: #2f3542;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding-bottom: 40px;
    }

    .app {
      max-width: 820px;
      margin: 0 auto;
      padding: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }

    h1, h2, h3 {
      margin: 0 0 10px 0;
      font-weight: 700;
    }

    h1 { font-size: 1.15rem; }
    h2 {
      font-size: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .row > * { flex: 1 1 auto; }

    input, select, button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      padding: 10px 12px;
      min-height: 44px;
    }

    input::placeholder { color: var(--muted); }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.06s ease, background 0.15s ease, border-color 0.15s ease;
    }

    button:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .btn-ok {
      background: rgba(81, 207, 102, 0.16);
      border-color: rgba(81, 207, 102, 0.45);
      color: #b2f2bb;
    }

    .btn-danger {
      background: rgba(255, 107, 107, 0.14);
      border-color: rgba(255, 107, 107, 0.42);
      color: #ffa8a8;
      min-height: 36px;
      padding: 6px 10px;
      font-size: 0.85rem;
    }

    .btn-ghost {
      background: var(--surface-2);
      color: var(--text);
      min-height: 38px;
      padding: 6px 12px;
      font-size: 0.88rem;
    }

    .btn-ghost.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    /* Barra evento attivo stile palmare */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(25, 28, 34, 0.96);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .topbar-title {
      font-weight: 700;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-sub {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .topbar-total {
      text-align: right;
      flex: 0 0 auto;
    }

    .topbar-total .amount {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--ok);
    }

    /* Griglia pulsanti stile palmare */
    .pos-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .pos-toolbar input {
      flex: 1 1 180px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 10px;
    }

    .product-card-wrap {
      position: relative;
      display: flex;
    }

    .product-btn {
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      text-align: left;
      min-height: 88px;
      padding: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .product-btn:hover { border-color: var(--accent); }

    .product-name {
      font-size: 0.98rem;
      font-weight: 700;
      padding-right: 18px;
    }

    .product-meta {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .price-tag {
      color: var(--ok);
      font-weight: 700;
    }

    .remove-prod-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      min-height: 28px;
      width: 28px;
      padding: 0;
      border-radius: 8px;
      background: rgba(255, 107, 107, 0.2);
      border-color: rgba(255, 107, 107, 0.5);
      color: #ffa8a8;
      font-size: 0.85rem;
      line-height: 1;
    }

    .subtabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .subtab-btn {
      min-height: 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .subtab-btn.active {
      background: var(--surface-3);
      border-color: var(--accent);
      color: var(--text);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .event-item {
      cursor: pointer;
    }

    .event-item:hover {
      border-color: var(--accent);
    }

    .item-main { min-width: 0; }
    .item-title { font-weight: 700; word-break: break-word; }
    .item-sub { font-size: 0.82rem; color: var(--muted); }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(252, 196, 25, 0.15);
      color: var(--warn);
      border: 1px solid rgba(252, 196, 25, 0.35);
      white-space: nowrap;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.74);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: 100%;
      max-width: 450px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 12px 0;
    }

    .chip {
      min-height: 30px;
      padding: 4px 10px;
      font-size: 0.8rem;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
    }

    .empty {
      color: var(--muted);
      font-size: 0.9rem;
      padding: 8px 0;
    }

    .hidden { display: none !important; }

    @media (max-width: 520px) {
      .products-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- SCHERMATA 1: ELENCO MERCATINI -->
    <section id="eventsScreen">
      <div class="card">
        <h1>Nuovo Mercatino</h1>
        <form id="newEventForm" class="row">
          <input id="eventNameInput" type="text" placeholder="Nome mercatino (es. Mercatino Maggio)" required />
          <input id="eventDateInput" type="date" style="max-width: 165px;" required />
          <button type="submit" class="btn-primary">+ Crea e apri</button>
        </form>
      </div>

      <div class="card">
        <h2>Mercatini salvati</h2>
        <div id="eventsList" class="list"></div>
      </div>
    </section>

    <!-- SCHERMATA 2: DETTAGLIO MERCATINO (STILE PALMARE) -->
    <section id="eventDetailScreen" class="hidden">
      <div class="topbar">
        <div class="topbar-left">
          <button id="backToEventsBtn" type="button" class="btn-ghost">← Mercatini</button>
          <div style="min-width: 0;">
            <div id="activeEventTitle" class="topbar-title">Evento</div>
            <div id="activeEventMeta" class="topbar-sub">0 pezzi</div>
          </div>
        </div>
        <div class="topbar-total">
          <div class="topbar-sub">Totale</div>
          <div id="activeEventTotal" class="amount">0,00 €</div>
        </div>
      </div>

      <!-- SEZIONE PULSANTI PRODOTTI (GLOBALE, SEMPRE ACCESSIBILE NELLA SCHERMATA MERCATINO) -->
      <div class="card">
        <h2>Pulsanti prodotti</h2>
        <div class="pos-toolbar">
          <input id="productSearchInput" type="search" placeholder="Cerca prodotto..." />
          <button id="openAddProductBtn" type="button" class="btn-primary">+ Prodotto</button>
          <button id="toggleRemoveModeBtn" type="button" class="btn-ghost">Rimuovi</button>
        </div>
        <div id="productsGrid" class="products-grid"></div>
      </div>

      <!-- SWITCHER VENDITE / RIMPIAZZI DEL MERCATINO ATTIVO -->
      <div class="subtabs">
        <button id="tabSalesBtn" type="button" class="subtab-btn active">Vendite & Totale</button>
        <button id="tabRestocksBtn" type="button" class="subtab-btn">Rimpiazzi (<span id="restockCountBadge">0</span>)</button>
      </div>

      <!-- VISTA VENDITE E TOTALE -->
      <div id="salesPanel" class="card">
        <div class="row" style="margin-bottom: 10px;">
          <h2 style="margin: 0;">Storico vendite mercatino</h2>
          <span id="salesSummaryText" class="item-sub" style="flex: 0 0 auto;"></span>
        </div>
        <div id="salesList" class="list"></div>
      </div>

      <!-- VISTA RIMPIAZZI -->
      <div id="restocksPanel" class="card hidden">
        <h2>Elenco rimpiazzi mercatino</h2>
        <div id="restocksList" class="list"></div>
      </div>
    </section>
  </div>

  <!-- MODALE VENDITA CON DETTAGLIO -->
  <div id="saleModal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <h3 id="saleModalTitle">Vendita</h3>
      <form id="saleModalForm">
        <div class="row" style="margin-bottom: 10px;">
          <div style="flex: 1;">
            <label for="saleModalPrice" class="item-sub" style="display:block; margin-bottom:4px;">Prezzo unitario (€)</label>
            <input id="saleModalPrice" type="number" step="0.01" min="0" required style="width: 100%;" />
          </div>
          <div style="max-width: 105px;">
            <label for="saleModalQty" class="item-sub" style="display:block; margin-bottom:4px;">Quantità</label>
            <input id="saleModalQty" type="number" min="1" value="1" required style="width: 100%;" />
          </div>
        </div>

        <label for="saleModalDetail" class="item-sub" style="display:block; margin-bottom:4px;">Personaggio / Dettaglio (va nei rimpiazzi)</label>
        <input id="saleModalDetail" type="text" placeholder="Es. Batman, Frida, Gatto..." style="width: 100%;" />

        <div id="recentDetailsChips" class="chips"></div>

        <div class="row" style="margin-top: 12px;">
          <button type="button" id="cancelSaleModalBtn" class="btn-ghost">Annulla</button>
          <button type="submit" class="btn-ok">Segna vendita</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODALE AGGIUNGI PRODOTTO AL CATALOGO GLOBALE -->
  <div id="addProductModal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <h3>Nuovo pulsante prodotto</h3>
      <form id="addProductForm">
        <div style="margin-bottom: 10px;">
          <label for="newProdName" class="item-sub" style="display:block; margin-bottom:4px;">Nome prodotto</label>
          <input id="newProdName" type="text" placeholder="Es. Segnalibri" required style="width: 100%;" />
        </div>
        <div class="row" style="margin-bottom: 12px;">
          <div style="flex: 1;">
            <label for="newProdPrice" class="item-sub" style="display:block; margin-bottom:4px;">Prezzo memorizzato (€)</label>
            <input id="newProdPrice" type="number" step="0.01" min="0" placeholder="3.00" required style="width: 100%;" />
          </div>
          <div style="flex: 1.3;">
            <label for="newProdDetail" class="item-sub" style="display:block; margin-bottom:4px;">Comportamento</label>
            <select id="newProdDetail" style="width: 100%;">
              <option value="true">Chiede dettaglio (es. personaggio)</option>
              <option value="false">Click rapido diretto</option>
            </select>
          </div>
        </div>
        <div class="row">
          <button type="button" id="cancelAddProductBtn" class="btn-ghost">Annulla</button>
          <button type="submit" class="btn-primary">Aggiungi al catalogo</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "mercatini_pos_v2";

    function todayISO() {
      return new Date().toISOString().slice(0, 10);
    }

    function defaultState() {
      const evtId = "evt_" + Date.now();
      return {
        view: "events", // "events" | "detail"
        activeSubtab: "sales", // "sales" | "restocks"
        activeEventId: evtId,
        events: [
          { id: evtId, name: "Mercatino Maggio", date: todayISO() }
        ],
        products: [
          { id: "p_segnalibri", name: "Segnalibri", price: 3.0, needsDetail: true },
          { id: "p_portachiavi", name: "Portachiavi", price: 5.0, needsDetail: true },
          { id: "p_stampe", name: "Stampe A5", price: 8.0, needsDetail: false }
        ],
        sales: [],
        restocks: []
      };
    }

    let state = loadState();
    let removeMode = false;
    let pendingSaleProduct = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        return { ...defaultState(), ...JSON.parse(raw) };
      } catch {
        return defaultState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function formatEuro(val) {
      return (Number(val) || 0).toLocaleString("it-IT", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + " €";
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function getActiveEvent() {
      return state.events.find(e => e.id === state.activeEventId) || state.events[0] || null;
    }

    function openEvent(eventId) {
      state.activeEventId = eventId;
      state.view = "detail";
      removeMode = false;
      saveState();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function registerSale({ product, price, qty, detail }) {
      const evt = getActiveEvent();
      if (!evt) return;

      const cleanPrice = Math.max(0, Number(price) || 0);
      const cleanQty = Math.max(1, parseInt(qty, 10) || 1);
      const cleanDetail = (detail || "").trim();

      // Memorizza eventuale nuovo prezzo sul prodotto globale
      const prodRef = state.products.find(p => p.id === product.id);
      if (prodRef) {
        prodRef.price = cleanPrice;
      }

      state.sales.unshift({
        id: "s_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        eventId: evt.id,
        timestamp: new Date().toISOString(),
        productName: product.name,
        detail: cleanDetail,
        unitPrice: cleanPrice,
        qty: cleanQty,
        total: cleanPrice * cleanQty
      });

      const existingRestock = state.restocks.find(
        r =>
          r.eventId === evt.id &&
          r.productName.toLowerCase() === product.name.toLowerCase() &&
          (r.detail || "").toLowerCase() === cleanDetail.toLowerCase()
      );

      if (existingRestock) {
        existingRestock.qty += cleanQty;
      } else {
        state.restocks.unshift({
          id: "r_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
          eventId: evt.id,
          productName: product.name,
          detail: cleanDetail,
          qty: cleanQty
        });
      }

      saveState();
      render();
    }

    function handleProductClick(product) {
      if (removeMode) {
        state.products = state.products.filter(p => p.id !== product.id);
        saveState();
        render();
        return;
      }

      if (product.needsDetail) {
        pendingSaleProduct = product;
        document.getElementById("saleModalTitle").textContent = `${product.name}`;
        document.getElementById("saleModalPrice").value = Number(product.price).toFixed(2);
        document.getElementById("saleModalQty").value = 1;
        document.getElementById("saleModalDetail").value = "";

        const chips = document.getElementById("recentDetailsChips");
        chips.innerHTML = "";
        const previousDetails = [...new Set(
          state.sales
            .filter(s => s.productName.toLowerCase() === product.name.toLowerCase() && s.detail)
            .map(s => s.detail)
        )].slice(0, 8);

        previousDetails.forEach(d => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "chip";
          b.textContent = d;
          b.onclick = () => {
            document.getElementById("saleModalDetail").value = d;
          };
          chips.appendChild(b);
        });

        document.getElementById("saleModal").classList.add("open");
        document.getElementById("saleModalDetail").focus();
      } else {
        registerSale({ product, price: product.price, qty: 1, detail: "" });
      }
    }

    function render() {
      const eventsScreen = document.getElementById("eventsScreen");
      const detailScreen = document.getElementById("eventDetailScreen");

      if (state.view === "events" || !getActiveEvent()) {
        eventsScreen.classList.remove("hidden");
        detailScreen.classList.add("hidden");
        renderEventsList();
        return;
      }

      eventsScreen.classList.add("hidden");
      detailScreen.classList.remove("hidden");
      renderEventDetail();
    }

    function renderEventsList() {
      const list = document.getElementById("eventsList");
      list.innerHTML = "";

      if (state.events.length === 0) {
        list.innerHTML = `<div class="empty">Nessun mercatino creato. Crea il primo qui sopra.</div>`;
        return;
      }

      state.events.forEach(evt => {
        const evtSales = state.sales.filter(s => s.eventId === evt.id);
        const total = evtSales.reduce((sum, s) => sum + s.total, 0);
        const pieces = evtSales.reduce((sum, s) => sum + s.qty, 0);

        const item = document.createElement("div");
        item.className = "list-item event-item";
        item.innerHTML = `
          <div class="item-main">
            <div class="item-title">${escapeHtml(evt.name)}</div>
            <div class="item-sub">${escapeHtml(evt.date || "")} • ${pieces} pezzi venduti</div>
          </div>
          <div class="row" style="flex: 0 0 auto; gap: 8px;">
            <span class="price-tag">${formatEuro(total)}</span>
            <button type="button" class="btn-ghost">Apri</button>
          </div>
        `;
        item.onclick = () => openEvent(evt.id);
        list.appendChild(item);
      });
    }

    function renderEventDetail() {
      const evt = getActiveEvent();
      const evtSales = state.sales.filter(s => s.eventId === evt.id);
      const evtRestocks = state.restocks.filter(r => r.eventId === evt.id && r.qty > 0);

      const total = evtSales.reduce((sum, s) => sum + s.total, 0);
      const pieces = evtSales.reduce((sum, s) => sum + s.qty, 0);
      const restockPieces = evtRestocks.reduce((sum, r) => sum + r.qty, 0);

      document.getElementById("activeEventTitle").textContent = evt.name;
      document.getElementById("activeEventMeta").textContent = `${evt.date || ""} • ${pieces} pezzi`;
      document.getElementById("activeEventTotal").textContent = formatEuro(total);
      document.getElementById("restockCountBadge").textContent = restockPieces;
      document.getElementById("salesSummaryText").textContent = `Totale: ${formatEuro(total)} (${pieces} pz)`;

      // Toggle modalità rimozione prodotti
      const removeBtn = document.getElementById("toggleRemoveModeBtn");
      removeBtn.classList.toggle("active", removeMode);
      removeBtn.textContent = removeMode ? "Fine rimozione" : "Rimuovi";

      // Pulsanti prodotti con ricerca
      const query = (document.getElementById("productSearchInput").value || "").trim().toLowerCase();
      const filteredProducts = state.products.filter(p => p.name.toLowerCase().includes(query));
      const grid = document.getElementById("productsGrid");
      grid.innerHTML = "";

      if (filteredProducts.length === 0) {
        grid.innerHTML = `<div class="empty">Nessun prodotto trovato.</div>`;
      } else {
        filteredProducts.forEach(prod => {
          const wrap = document.createElement("div");
          wrap.className = "product-card-wrap";

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "product-btn";
          btn.innerHTML = `
            <div class="product-name">${escapeHtml(prod.name)}</div>
            <div class="product-meta">
              <span class="price-tag">${formatEuro(prod.price)}</span>
              <span>${prod.needsDetail ? "+ dettaglio" : "rapido"}</span>
            </div>
          `;
          btn.onclick = () => handleProductClick(prod);
          wrap.appendChild(btn);

          if (removeMode) {
            const delBtn = document.createElement("button");
            delBtn.type = "button";
            delBtn.className = "remove-prod-btn";
            delBtn.title = "Rimuovi prodotto";
            delBtn.textContent = "×";
            delBtn.onclick = (e) => {
              e.stopPropagation();
              state.products = state.products.filter(p => p.id !== prod.id);
              saveState();
              render();
            };
            wrap.appendChild(delBtn);
          }

          grid.appendChild(wrap);
        });
      }

      // Subtab attivi
      const isSales = state.activeSubtab === "sales";
      document.getElementById("tabSalesBtn").classList.toggle("active", isSales);
      document.getElementById("tabRestocksBtn").classList.toggle("active", !isSales);
      document.getElementById("salesPanel").classList.toggle("hidden", !isSales);
      document.getElementById("restocksPanel").classList.toggle("hidden", isSales);

      // Storico vendite del mercatino
      const salesList = document.getElementById("salesList");
      salesList.innerHTML = "";
      if (evtSales.length === 0) {
        salesList.innerHTML = `<div class="empty">Nessuna vendita registrata in questo mercatino.</div>`;
      } else {
        evtSales.forEach(s => {
          const row = document.createElement("div");
          row.className = "list-item";
          const time = new Date(s.timestamp).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
          const detailInfo = s.detail ? ` • <strong>${escapeHtml(s.detail)}</strong>` : "";
          row.innerHTML = `
            <div class="item-main">
              <div class="item-title">${escapeHtml(s.productName)} x${s.qty} — <span class="price-tag">${formatEuro(s.total)}</span></div>
              <div class="item-sub">${time}${detailInfo}</div>
            </div>
            <button type="button" class="btn-danger">Elimina</button>
          `;
          row.querySelector("button").onclick = () => {
            state.sales = state.sales.filter(item => item.id !== s.id);
            saveState();
            render();
          };
          salesList.appendChild(row);
        });
      }

      // Rimpiazzi del mercatino
      const restocksList = document.getElementById("restocksList");
      restocksList.innerHTML = "";
      if (evtRestocks.length === 0) {
        restocksList.innerHTML = `<div class="empty">Nessun pezzo da rimpiazzare per questo mercatino.</div>`;
      } else {
        evtRestocks.forEach(r => {
          const row = document.createElement("div");
          row.className = "list-item";
          const detailText = r.detail ? ` — <strong>${escapeHtml(r.detail)}</strong>` : "";
          row.innerHTML = `
            <div class="item-main">
              <div class="item-title">${escapeHtml(r.productName)}${detailText}</div>
              <div class="item-sub">Da rimpiazzare</div>
            </div>
            <div class="row" style="flex: 0 0 auto; gap: 6px;">
              <span class="badge">x${r.qty}</span>
              <button type="button" class="btn-ghost">-1</button>
              <button type="button" class="btn-danger">Fatto</button>
            </div>
          `;
          const [minusBtn, doneBtn] = row.querySelectorAll("button");
          minusBtn.onclick = () => {
            r.qty = Math.max(0, r.qty - 1);
            state.restocks = state.restocks.filter(item => item.qty > 0);
            saveState();
            render();
          };
          doneBtn.onclick = () => {
            state.restocks = state.restocks.filter(item => item.id !== r.id);
            saveState();
            render();
          };
          restocksList.appendChild(row);
        });
      }
    }

    // Inizializza data default nuovo mercatino
    document.getElementById("eventDateInput").value = todayISO();

    document.getElementById("newEventForm").onsubmit = (e) => {
      e.preventDefault();
      const nameInput = document.getElementById("eventNameInput");
      const dateInput = document.getElementById("eventDateInput");
      const name = nameInput.value.trim();
      if (!name) return;

      const newEvt = {
        id: "evt_" + Date.now(),
        name,
        date: dateInput.value || todayISO()
      };
      state.events.unshift(newEvt);
      nameInput.value = "";
      dateInput.value = todayISO();
      openEvent(newEvt.id);
    };

    document.getElementById("backToEventsBtn").onclick = () => {
      state.view = "events";
      removeMode = false;
      saveState();
      render();
    };

    document.getElementById("productSearchInput").oninput = () => {
      renderEventDetail();
    };

    document.getElementById("toggleRemoveModeBtn").onclick = () => {
      removeMode = !removeMode;
      renderEventDetail();
    };

    document.getElementById("tabSalesBtn").onclick = () => {
      state.activeSubtab = "sales";
      saveState();
      renderEventDetail();
    };

    document.getElementById("tabRestocksBtn").onclick = () => {
      state.activeSubtab = "restocks";
      saveState();
      renderEventDetail();
    };

    // Modale vendita dettaglio
    document.getElementById("saleModalForm").onsubmit = (e) => {
      e.preventDefault();
      if (!pendingSaleProduct) return;
      const price = parseFloat(document.getElementById("saleModalPrice").value);
      const qty = parseInt(document.getElementById("saleModalQty").value, 10);
      const detail = document.getElementById("saleModalDetail").value.trim();

      registerSale({ product: pendingSaleProduct, price, qty, detail });
      pendingSaleProduct = null;
      document.getElementById("saleModal").classList.remove("open");
    };

    document.getElementById("cancelSaleModalBtn").onclick = () => {
      pendingSaleProduct = null;
      document.getElementById("saleModal").classList.remove("open");
    };

    // Modale aggiungi prodotto globale
    document.getElementById("openAddProductBtn").onclick = () => {
      removeMode = false;
      document.getElementById("addProductModal").classList.add("open");
      document.getElementById("newProdName").focus();
    };

    document.getElementById("cancelAddProductBtn").onclick = () => {
      document.getElementById("addProductModal").classList.remove("open");
    };

    document.getElementById("addProductForm").onsubmit = (e) => {
      e.preventDefault();
      const name = document.getElementById("newProdName").value.trim();
      const price = parseFloat(document.getElementById("newProdPrice").value);
      const needsDetail = document.getElementById("newProdDetail").value === "true";
      if (!name || isNaN(price) || price < 0) return;

      const existing = state.products.find(p => p.name.toLowerCase() === name.toLowerCase());
      if (existing) {
        existing.price = price;
        existing.needsDetail = needsDetail;
      } else {
        state.products.push({
          id: "p_" + Date.now(),
          name,
          price,
          needsDetail
        });
      }

      e.target.reset();
      document.getElementById("addProductModal").classList.remove("open");
      saveState();
      renderEventDetail();
    };

    render();
  </script>
</body>
</html>
